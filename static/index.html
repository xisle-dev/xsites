<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X/Sites — Google Satellite over AWS DEM</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.7.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <div class="panel-header">
      <div class="brand">
        <img src="logo.svg" alt="" class="brand-logo" />
        <h1>X/Sites</h1>
      </div>

      <button type="button" id="terrainToggle" class="terrain-toggle" aria-expanded="true">
        <span>Map Controls</span>
        <span class="chevron">&#9650;</span>
      </button>
      <div id="terrainContent" class="terrain-content">
        <div class="zoom-controls">
          <button type="button" id="zoomInBtn" title="Zoom in" aria-label="Zoom in">+</button>
          <button type="button" id="zoomOutBtn" title="Zoom out" aria-label="Zoom out">&minus;</button>
        </div>

        <label for="pitch">Pitch: <span id="pitchValue">0</span>&deg;</label>
        <input type="range" id="pitch" min="0" max="80" step="1" value="0" />

        <label for="exaggeration">Terrain exaggeration: <span id="exaggerationValue">1.5</span>&times;</label>
        <input type="range" id="exaggeration" min="0.5" max="4" step="0.1" value="1.5" />

        <div class="airspace-controls">
          <label class="airspace-toggle-row">
            <input type="checkbox" id="airspaceToggle" checked />
            <span>Show airspace</span>
          </label>
          <div id="airspaceLegend" class="airspace-legend">
            <label><input type="checkbox" data-airspace-class="B" /> <span class="swatch" style="background:#3b82f6"></span> Class B</label>
            <label><input type="checkbox" data-airspace-class="C" checked /> <span class="swatch" style="background:#ec4899"></span> Class C</label>
            <label><input type="checkbox" data-airspace-class="D" checked /> <span class="swatch" style="background:#22d3ee"></span> Class D</label>
            <label><input type="checkbox" data-airspace-class="E" checked /> <span class="swatch" style="background:#a78bfa"></span> Class E</label>
            <label><input type="checkbox" data-airspace-class="F" checked /> <span class="swatch" style="background:#f97316"></span> Class F (advisory)</label>
            <label><input type="checkbox" data-airspace-class="SUA" checked /> <span class="swatch" style="background:#ef4444"></span> Restricted / danger</label>
          </div>
          <div class="airspace-attribution">
            Airspace data &copy; <a href="https://www.openaip.net" target="_blank" rel="noopener">OpenAIP</a> contributors, CC BY-NC 4.0. Not for navigation.
          </div>
        </div>
      </div>
    </div>

    <div id="sitesListView">
      <div class="sites-header">
        <h2>Sites</h2>
      </div>
      <div class="list-filters">
        <input type="text" id="siteSearch" placeholder="Filter sites or areas..." />
        <select id="areaFilter">
          <option value="">All areas</option>
        </select>
      </div>
      <div id="siteList"></div>
    </div>

    <div id="siteDetailView" hidden>
      <div class="sites-header">
        <button id="backToListBtn" class="link-btn">&larr; Back</button>
      </div>
      <div id="siteDetailContent"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
