name = "xsites-editor"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Custom domain -- custom_domain = true has wrangler provision and manage
# the DNS record + SSL cert itself (Cloudflare's "Custom Domains" feature),
# rather than a plain Route needing a separately hand-maintained DNS record.
# See github issue #20.
[[routes]]
pattern = "xisle.net"
custom_domain = true

# Editor frontend (index.html, app.js, style.css, logo/favicon.svg,
# data/airspace.geojson) -- copies of the same files server/main.go used to
# serve via http.FileServer(http.Dir(root)) -- see github issue #16. Assets
# are matched first; anything that doesn't match a file here (/api/*,
# /media/*) falls through to the Worker script below.
[assets]
directory = "./public"
binding = "ASSETS"
# /admin and /api go through the Worker first so it can enforce Basic auth
# (secret ADMIN_PASSWORD: `npx wrangler secret put ADMIN_PASSWORD`).
run_worker_first = ["/admin", "/admin/*", "/api/*"]

# LIVE_DATA: the live-editable source of truth (per-site YAML objects +
# media), read/written by every /api/sites request -- see github issue #11
# (the Workers-port roadmap) for how this replaces server/store.go's
# r2SiteStore.
[[r2_buckets]]
binding = "LIVE_DATA"
bucket_name = "xsites-live-data"

# PUBLIC_SITE: the public read-only viewer's bucket (sites.json,
# media/<id>/<file>, the PMTiles archive). The instant-publish mirror
# (issue #18) keeps sites.json/media/* current here on every save.
[[r2_buckets]]
binding = "PUBLIC_SITE"
bucket_name = "xsites"

# QA: a fully separate Worker (xsites-editor-qa), domain and pair of buckets
# in the same Cloudflare account, deployed with `wrangler deploy --env qa`.
# Nothing here is shared with PROD above except the code and static files.
# r2_buckets aren't inherited by environments, so both are redeclared.
[env.qa]
routes = [{ pattern = "qa.xisle.net", custom_domain = true }]

[[env.qa.r2_buckets]]
binding = "LIVE_DATA"
bucket_name = "xsites-live-data-qa"

[[env.qa.r2_buckets]]
binding = "PUBLIC_SITE"
bucket_name = "xsites-qa"
