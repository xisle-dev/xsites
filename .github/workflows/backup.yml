# Nightly backup of PROD's site data (R2 xsites-live-data: every
# sites/<id>.yaml and its media) onto this repo's "backup" branch, committed
# only when something changed -- so that branch's history is a dated record
# of every edit. The branch is an orphan: it shares no history with master
# and never triggers a deploy. The derived sites.json and the regenerable
# ~200 MB tiles/ are left out. Restore with the Restore PROD workflow.
#
# PROD only. Runs in the "prod-backup" environment (no approval needed),
# whose only secrets -- a read-only R2 token on PROD's bucket -- are written
# by `go run ./setup`. Pushing uses the workflow's own GITHUB_TOKEN.
name: 3. Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *" # daily, ~3:30am Pacific

permissions:
  contents: write

concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: prod-backup
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
        with:
          path: backup
      # The first run creates the branch; after that, build on its tip.
      - name: Switch to the backup branch
        working-directory: backup
        run: |
          if git ls-remote --exit-code --heads origin backup >/dev/null; then
            git fetch --depth=1 origin backup
            git checkout -B backup FETCH_HEAD
          else
            git checkout --orphan backup
            git rm -rqf .
          fi
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      # An empty bucket means PROD was wiped or is being rebuilt, not that
      # every site was deleted. Backing it up would make the newest snapshot
      # empty, and Deploy seeds a fresh bucket from that snapshot -- so stop
      # and keep the last good backup instead.
      - name: Refuse to back up an empty bucket
        run: |
          n=$(rclone lsf r2:xsites-live-data/sites --include "*.yaml" --max-depth 1 | wc -l)
          echo "sites in PROD: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::PROD's bucket has no sites; not overwriting the last backup"
            exit 1
          fi
      - name: Copy live data from R2
        run: rclone sync r2:xsites-live-data backup/data --exclude "tiles/**" --exclude "/sites.json" -v
      - name: Commit if changed
        working-directory: backup
        run: |
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes since last backup."
            exit 0
          fi
          git config user.name "xsites backup"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push origin backup
