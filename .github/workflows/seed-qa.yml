# Replaces QA's site data with a copy of PROD's from the latest nightly
# backup, so QA can be tested against real sites. QA never touches PROD: it
# reads the backup repo through a read-only deploy key and writes only to
# its own bucket. QA's tiles are left alone. Run by hand whenever QA should
# be reset.
#
# Uses the "qa" environment's secrets and R2_BUCKET variable plus
# BACKUP_READ_KEY, all written by `go run ./setup`.
name: Seed QA from PROD backup

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: qa
    env:
      QA_URL: https://qa.xisle.net
      BUCKET: ${{ vars.R2_BUCKET }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      # Belt and braces on top of the bucket-scoped token: refuse to write
      # anywhere that isn't obviously QA's bucket.
      - name: Check the target is a QA bucket
        run: |
          case "$BUCKET" in *-qa) ;; *) echo "::error::R2_BUCKET=$BUCKET is not a QA bucket"; exit 1;; esac
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKUP_REPO }}
          ssh-key: ${{ secrets.BACKUP_READ_KEY }}
          path: backup
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      # sync deletes QA sites that aren't in the backup; excluded paths
      # (tiles, sites.json) are neither copied nor deleted.
      - name: Copy site records and media into QA's bucket
        run: rclone sync backup/data "r2:$BUCKET" --exclude "tiles/**" --exclude "/sites.json" -v
      # sites.json is derived; with it gone, the next list request rebuilds it
      # from the YAML just copied. Request it now so that happens here.
      - name: Rebuild sites.json
        run: |
          rclone deletefile "r2:$BUCKET/sites.json" || true
          curl -fsS "$QA_URL/sites.json" -o sites.json
          echo "sites in QA: $(grep -o '"id":' sites.json | wc -l)"
