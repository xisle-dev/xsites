# Checks for a newer Protomaps tiles build and, if there is one, opens a pull
# request bumping etl/tiles-date.txt. The merge deploys to QA, which rebuilds
# the tiles (see deploy.yml); run Deploy on master for PROD.
#
# Airspace isn't handled here: Deploy fetches the latest on every run.
#
# No secrets needed. Requires Settings > Actions > General > "Allow GitHub
# Actions to create and approve pull requests" (setup turns it on).
name: 2. Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 1 * *" # 1st of each month

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: etl/go.mod
          cache-dependency-path: etl/go.sum
      - name: Find the latest tiles build
        working-directory: etl
        run: |
          echo "tiles: was $(cat tiles-date.txt)"
          go run . tiles-latest > tiles-date.txt
          echo "tiles: now $(cat tiles-date.txt)"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-update
          delete-branch: true
          commit-message: "Update tiles"
          title: "Update tiles"
          body: |
            Made by the Update workflow: `etl/tiles-date.txt` set to the
            newest Protomaps build.

            Merging deploys to QA, rebuilding the tiles.
            Run Deploy on master to take it to PROD.
          add-paths: |
            etl/tiles-date.txt
