# Restores PROD's site data (sites/<id>.yaml and media) from a snapshot on
# this repo's "backup" branch -- the latest one, or any earlier commit on
# it. Tiles are left alone and sites.json is rebuilt. Runs in the "prod"
# environment, so it waits for your approval like a PROD deploy.
#
# Before overwriting anything it saves PROD's current data as a workflow
# artifact ("prod-before-restore", kept 30 days), so a restore can itself be
# undone by downloading that and syncing it back.
name: Restore PROD from backup

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Backup commit SHA to restore (blank = latest backup)"
        required: false
        default: ""
      confirm:
        description: 'Type "restore prod" to confirm'
        required: true

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://xisle.net
    env:
      BUCKET: ${{ vars.R2_BUCKET }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'restore prod'
        run: |
          echo "::error::Type exactly: restore prod"
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'backup' }}
          path: backup
      - name: Show the snapshot being restored
        working-directory: backup
        run: |
          git log -1 --format='Restoring backup %h from %cd: %s'
          test -d data/sites || { echo "::error::$(git rev-parse --short HEAD) is not a backup commit"; exit 1; }
          echo "sites: $(ls data/sites/*.yaml | wc -l)"
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Save PROD's current data first
        run: rclone copy "r2:$BUCKET" before --exclude "tiles/**" --exclude "/sites.json" -v
      - uses: actions/upload-artifact@v4
        with:
          name: prod-before-restore
          path: before
          retention-days: 30
          if-no-files-found: ignore
      # sync makes PROD match the snapshot (sites added since are removed);
      # excluded paths (tiles, sites.json) are neither copied nor deleted.
      - name: Restore the snapshot into PROD
        run: rclone sync backup/data "r2:$BUCKET" --exclude "tiles/**" --exclude "/sites.json" -v
      # sites.json is derived; with it gone, the next request rebuilds it from
      # the restored YAML. Request it now so that happens here.
      - name: Rebuild sites.json
        run: |
          rclone deletefile "r2:$BUCKET/sites.json" || true
          curl -fsS https://xisle.net/sites.json -o sites.json
          echo "sites in PROD: $(grep -o '"id":' sites.json | wc -l)"
