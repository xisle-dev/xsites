name: Deploy static site to R2

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build static site
        run: |
          cd tools/buildstatic
          go build -o buildstatic .
          ./buildstatic ../.. ../../dist

      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # sites.json and media/* are excluded from --delete's scope because
          # the Cloudflare Worker editor (worker/, github issue #11) mirrors
          # every save straight into this same bucket -- this workflow only
          # manages the static code/asset files now. Without the exclusion,
          # every code-only deploy would wipe out whatever the editor most
          # recently published, reverting to this repo's now-stale
          # sites/*.yaml snapshot.
          aws s3 sync dist/ "s3://${{ secrets.R2_BUCKET_NAME }}" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --delete \
            --exclude "*.pmtiles" \
            --exclude "sites.json" \
            --exclude "media/*"
