# Rebuilds the Vancouver Island label tiles from a Protomaps daily build and
# uploads them to the chosen environment's bucket
# (tiles/labels-vancouver-island.pmtiles). The ~200 MB archive never
# touches git. Run by hand when you want fresher labels -- QA first, then
# PROD (which waits for your approval); the Worker picks up the new file
# immediately, no deploy needed.
#
# Uses the target environment's secrets and R2_BUCKET variable,
# written by `go run ./setup`.
name: Tiles

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to upload to"
        type: choice
        options: [qa, prod]
        default: qa
      date:
        description: "Protomaps build date YYYYMMDD (blank = latest)"
        required: false
        default: ""

jobs:
  tiles:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: etl/go.mod
          cache-dependency-path: etl/go.sum
      - name: Build labels-vancouver-island.pmtiles
        working-directory: etl
        env:
          BUILD_DATE: ${{ inputs.date }}
        run: go run . tiles $BUILD_DATE
      - name: Sanity-check size
        run: |
          size=$(stat -c %s etl/output/labels-vancouver-island.pmtiles)
          echo "pmtiles: $size bytes"
          if [ "$size" -lt 20000000 ]; then
            echo "::error::pmtiles is only $size bytes; expected ~200 MB"
            exit 1
          fi
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Upload to R2
        run: |
          rclone copyto etl/output/labels-vancouver-island.pmtiles \
            "r2:${{ vars.R2_BUCKET }}/tiles/labels-vancouver-island.pmtiles" \
            --s3-no-check-bucket --header-upload "Content-Type: application/octet-stream" -v
