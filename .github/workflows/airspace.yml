# Regenerates the airspace overlay from OpenAIP's public export and opens a
# pull request with the result. Airspace is safety-relevant, so a person
# reviews and merges the PR; the merge to master then triggers Deploy.
#
# No secrets needed (OpenAIP's export bucket is public and anonymous).
# Requires Settings > Actions > General > "Allow GitHub Actions to create
# and approve pull requests".
name: Airspace

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 1 * *" # 1st of each month

permissions:
  contents: write
  pull-requests: write

jobs:
  airspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: etl/go.mod
          cache-dependency-path: etl/go.sum
      - name: Build airspace.geojson
        working-directory: etl
        run: go run . airspace
      # A bad trim shows up as a wildly different size -- fail rather than
      # open a PR with an obviously broken file. Today's is ~320 KB.
      - name: Sanity-check size
        run: |
          size=$(stat -c %s etl/output/airspace.geojson)
          echo "airspace.geojson: $size bytes"
          if [ "$size" -lt 50000 ] || [ "$size" -gt 5000000 ]; then
            echo "::error::airspace.geojson is $size bytes, outside the expected 50 KB - 5 MB range"
            exit 1
          fi
      - name: Copy into the served files
        run: cp etl/output/airspace.geojson server/public/data/airspace.geojson
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: airspace-update
          delete-branch: true
          commit-message: "Update airspace from OpenAIP"
          title: "Update airspace from OpenAIP"
          body: |
            Regenerated by the Airspace workflow from OpenAIP's Canada export,
            trimmed to the Vancouver Island flying area.

            Review the diff before merging. Merging to master deploys it.
          add-paths: |
            etl/output/airspace.geojson
            server/public/data/airspace.geojson
