# Deploys the Worker (server/src) and its static files (server/public,
# including data/airspace.geojson): first to QA (xsites-editor-qa,
# qa.xisle.net), then the same commit to PROD (xsites-editor, xisle.net)
# once you approve it -- the "prod" GitHub environment requires a reviewer.
# A newer push replaces a PROD deploy still waiting for approval.
#
# Each job reads only its own environment's secrets (written by
# `go run ./setup`): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# ADMIN_PASSWORD, which every deploy pushes to that Worker as its secret.
name: Deploy

on:
  push:
    branches: [master]
    paths: ["server/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://qa.xisle.net
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          environment: qa
          command: deploy
          secrets: |
            ADMIN_PASSWORD
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  prod:
    needs: qa
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://xisle.net
    concurrency:
      group: deploy-prod
      cancel-in-progress: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
          secrets: |
            ADMIN_PASSWORD
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
