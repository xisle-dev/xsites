# Deploys the Worker (server/src) and its static files (server/public,
# including data/airspace.geojson) to Cloudflare on every push to master that
# touches server/. Replaces running `npx wrangler deploy` locally -- nothing
# here needs Node, npm or wrangler on your own machine.
#
# Secrets (all written by `go run ./setup`): CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, and ADMIN_PASSWORD, which every deploy pushes to the
# Worker as its secret so GitHub is the one place it's kept.
name: Deploy

on:
  push:
    branches: [master]
    paths: ["server/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
          secrets: |
            ADMIN_PASSWORD
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
